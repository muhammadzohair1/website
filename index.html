<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopMart - Online Shopping</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">ShopMart</a>
    <form id="search-form" class="search">
      <input id="search-input" type="search" placeholder="Search products..." aria-label="Search">
      <button type="submit">Search</button>
    </form>
    <nav class="top-links">
      <a href="index.html">Home</a>
      <a href="cart.html" class="cart-link">Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <h1>Everything you need, delivered fast</h1>
        <p>Shop electronics, fashion, home essentials, and more.</p>
      </div>
    </section>

    <section class="controls">
      <label>Category
        <select id="category-filter">
          <option value="all">All</option>
        </select>
      </label>
      <label>Sort
        <select id="sort-filter">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating">Top Rated</option>
        </select>
      </label>
    </section>

    <section>
      <h2>Products</h2>
      <div id="product-grid" class="grid"></div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 ShopMart. Demo ecommerce store.</p>
  </footer>

  <script src="app.js"></script>
  <script>
    ShopMart.initHome();
  </script>
</body>
</html>
