<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — ShopMart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'] },
          colors: {
            ink: '#0e120e',
            moss: { 50: '#f3f6f0', 100: '#e3ecdd', 200: '#c9d9be', 300: '#a5bf94', 400: '#7ea06a', 500: '#5c8547', 600: '#476a36', 700: '#3a552e', 800: '#2d4225', 900: '#1c2b17', 950: '#111a0e' },
            cream: '#f5f3ec'
          },
          boxShadow: { soft: '0 4px 24px -6px rgb(0 0 0 / 0.12)', card: '0 8px 30px -8px rgb(17 26 14 / 0.25)' }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap"
    rel="stylesheet">
</head>

<body class="bg-cream text-ink font-sans antialiased">

  <header class="sticky top-0 z-50 bg-cream/85 backdrop-blur-xl shadow-soft">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex h-16 md:h-[72px] items-center justify-between">
        <a href="index.html" class="flex items-center gap-2 font-extrabold tracking-tight text-xl"
          aria-label="ShopMart home">
          <span class="grid place-items-center size-9 rounded-xl bg-moss-500 text-white shadow-card">🛍️</span>
          Shop<span class="text-moss-400">Mart</span>
        </a>
        <nav class="hidden md:flex items-center gap-1" aria-label="Main">
          <a href="index.html"
            class="px-4 py-2 rounded-full text-sm font-semibold text-ink/70 hover:text-ink hover:bg-white transition">Home</a>
          <a href="index.html#categories"
            class="px-4 py-2 rounded-full text-sm font-semibold text-ink/70 hover:text-ink hover:bg-white transition">Collections</a>
        </nav>
        <a href="cart.html"
          class="inline-flex items-center gap-2 rounded-full bg-ink px-4 py-2 text-sm font-semibold text-white hover:bg-moss-700 transition">
          Cart <span id="cart-count"
            class="min-w-5 grid place-items-center rounded-full bg-moss-400 px-1.5 text-xs font-bold text-ink">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-10 md:py-14">
    <div id="product-detail"></div>
  </main>

  <footer class="bg-ink text-white/60">
    <div class="mx-auto max-w-7xl px-4 py-10 text-center text-xs text-white/40">© 2026 ShopMart · Demo store · Built
      with Tailwind CSS</div>
  </footer>

  <script src="app.js"></script>
  <script>ShopMart.initProduct();</script>
</body>

</html>
